<rect x="204.0" y="46.0" width="400.0" height="59.0" rx="7" fill="#F6E3E0" stroke="#B0544A" stroke-width="1.7"/>
<text x="404.0" y="71.6" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">Pérdidas económicas por multas, recargos e intereses de</text>
<text x="404.0" y="88.1" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">mora</text>
<rect x="730.0" y="46.0" width="400.0" height="59.0" rx="7" fill="#F6E3E0" stroke="#B0544A" stroke-width="1.7"/>
<text x="930.0" y="79.9" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">Deterioro de las relaciones familiares y laborales</text>
<rect x="1256.0" y="46.0" width="400.0" height="59.0" rx="7" fill="#F6E3E0" stroke="#B0544A" stroke-width="1.7"/>
<text x="1456.0" y="79.9" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">Deterioro de la salud mental: estrés crónico y ansiedad</text>
<rect x="204.0" y="161.0" width="400.0" height="59.0" rx="7" fill="#EDC9C2" stroke="#B0544A" stroke-width="1.7"/>
<text x="404.0" y="186.6" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">Incumplimiento de obligaciones legales y tributarias, y</text>
<text x="404.0" y="203.1" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">pérdida de descuentos por pronto pago</text>
<rect x="730.0" y="161.0" width="400.0" height="59.0" rx="7" fill="#EDC9C2" stroke="#B0544A" stroke-width="1.7"/>
<text x="930.0" y="194.9" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">Incumplimiento de compromisos familiares y laborales</text>
<rect x="1256.0" y="161.0" width="400.0" height="59.0" rx="7" fill="#EDC9C2" stroke="#B0544A" stroke-width="1.7"/>
<text x="1456.0" y="194.9" font-size="12.5" font-weight="400" fill="#6E2A22" text-anchor="middle">Desorganización y tensión sostenida en la rutina diaria</text>
<rect x="430.0" y="276.0" width="1000.0" height="56.0" rx="7" fill="#2B3440" stroke="#2B3440" stroke-width="1.7"/>
<text x="930.0" y="309.4" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Los adultos entre 25 y 55 años residentes en Colombia olvidan con frecuencia obligaciones recurrentes de la vida cotidiana</text>
<rect x="204.0" y="388.0" width="400.0" height="59.0" rx="7" fill="#CFDDE9" stroke="#3F7391" stroke-width="1.7"/>
<text x="404.0" y="413.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Sobrecarga cognitiva por gestionar en paralelo varios</text>
<text x="404.0" y="430.1" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">dominios de responsabilidad</text>
<rect x="730.0" y="388.0" width="400.0" height="59.0" rx="7" fill="#CFDDE9" stroke="#3F7391" stroke-width="1.7"/>
<text x="930.0" y="421.9" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Dispersión de la información en herramientas no integradas</text>
<rect x="1256.0" y="388.0" width="400.0" height="59.0" rx="7" fill="#CFDDE9" stroke="#3F7391" stroke-width="1.7"/>
<text x="1456.0" y="413.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Desconocimiento de los ciclos de vencimiento de cada</text>
<text x="1456.0" y="430.1" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">obligación</text>
<rect x="150.0" y="503.0" width="245.0" height="75.5" rx="7" fill="#E6EEF5" stroke="#3F7391" stroke-width="1.7"/>
<text x="272.5" y="536.9" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Diversidad de áreas de vida que un</text>
<text x="272.5" y="553.4" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">adulto administra simultáneamente</text>
<rect x="413.0" y="503.0" width="245.0" height="75.5" rx="7" fill="#E6EEF5" stroke="#3F7391" stroke-width="1.7"/>
<text x="535.5" y="528.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Dependencia de la memoria</text>
<text x="535.5" y="545.1" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">individual como único mecanismo de</text>
<text x="535.5" y="561.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">control</text>
<rect x="676.0" y="503.0" width="245.0" height="75.5" rx="7" fill="#E6EEF5" stroke="#3F7391" stroke-width="1.7"/>
<text x="798.5" y="528.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Uso de notas sueltas, capturas de</text>
<text x="798.5" y="545.1" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">pantalla y aplicaciones sin</text>
<text x="798.5" y="561.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">conexión entre sí</text>
<rect x="939.0" y="503.0" width="245.0" height="75.5" rx="7" fill="#E6EEF5" stroke="#3F7391" stroke-width="1.7"/>
<text x="1061.5" y="528.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Herramientas disponibles diseñadas</text>
<text x="1061.5" y="545.1" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">para contextos distintos al</text>
<text x="1061.5" y="561.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">colombiano</text>
<rect x="1202.0" y="503.0" width="245.0" height="75.5" rx="7" fill="#E6EEF5" stroke="#3F7391" stroke-width="1.7"/>
<text x="1324.5" y="528.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Los plazos legales y tributarios</text>
<text x="1324.5" y="545.1" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">varían por norma, tipo de bien y</text>
<text x="1324.5" y="561.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">municipio</text>
<rect x="1465.0" y="503.0" width="245.0" height="75.5" rx="7" fill="#E6EEF5" stroke="#3F7391" stroke-width="1.7"/>
<text x="1587.5" y="528.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">Ausencia de un criterio para</text>
<text x="1587.5" y="545.1" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">distinguir lo urgente con</text>
<text x="1587.5" y="561.6" font-size="12.5" font-weight="400" fill="#1D3D52" text-anchor="middle">consecuencia de lo deseable</text>
